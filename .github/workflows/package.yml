name: CI Package (Debug / Release)

# 云打包：本机 Xcode 15.2 能编译但不能归档到最新 SDK，macos-latest 的 Xcode 足够新。
#
# 工程已**完全不含第三方依赖**（没有 Podfile / workspace），因此直接用 -project 构建，
# 不需要 pod install，也不需要 workspace。
#
# 产出 2 个变体：
#   Debug    配置了 ADHOC_PROFILE 时用 Ad Hoc 描述文件签名 → **可直接装到已注册的真机**
#            未配置时退回未签名（本地再用证书 + Ad Hoc 描述文件重签）
#   Release  配置了 App Store 描述文件时签名 → 可直接上传审核；未配置则未签名
#
# 签名相关 secrets（缺任意一项则该变体退回未签名构建，不会失败）：
#   DIST_CERT_P12 / DIST_CERT_PASSWORD        Apple Distribution 证书（.p12 的 base64 + 密码）
#   DEVELOPER_TEAM_ID                         团队 ID
#   ADHOC_PROFILE / ADHOC_PROFILE_SPECIFIER   Ad Hoc 描述文件（.mobileprovision 的 base64 + Profile 名）
#   PROVISIONING_PROFILE / PROVISIONING_PROFILE_SPECIFIER   App Store 描述文件（同上）

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  package:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Debug
            configuration: Debug
          - label: Release
            configuration: Release
    env:
      CONFIG: ${{ matrix.configuration }}
      LABEL: ${{ matrix.label }}
      # NOTE: `if:` cannot reference the secrets context directly (invalid workflow),
      # so the flags are computed here and consumed through env.
      HAS_CERT: ${{ secrets.DIST_CERT_P12 != '' }}
      HAS_ADHOC_PROFILE: ${{ secrets.ADHOC_PROFILE_SPECIFIER != '' }}
      HAS_APPSTORE_PROFILE: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Show project targets
        run: |
          xcodebuild -list -project flip_chess.xcodeproj

      - name: Import distribution certificate
        if: env.HAS_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DIST_CERT_P12 }}
          p12-password: ${{ secrets.DIST_CERT_PASSWORD }}

      - name: Install Ad Hoc provisioning profile (Debug)
        if: env.HAS_CERT == 'true' && env.HAS_ADHOC_PROFILE == 'true' && matrix.configuration == 'Debug'
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "${{ secrets.ADHOC_PROFILE }}" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/flip_chess_adhoc.mobileprovision"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/flip_chess_adhoc.mobileprovision" | plutil -extract Name raw -

      - name: Install App Store provisioning profile (Release)
        if: env.HAS_CERT == 'true' && env.HAS_APPSTORE_PROFILE == 'true' && matrix.configuration == 'Release'
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/flip_chess_appstore.mobileprovision"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/flip_chess_appstore.mobileprovision" | plutil -extract Name raw -

      - name: Archive (${{ matrix.label }})
        env:
          TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
          ADHOC_SPECIFIER: ${{ secrets.ADHOC_PROFILE_SPECIFIER }}
          PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -o pipefail

          # 按变体挑描述文件；任一前提缺失就退回未签名，保证流程不会因为没配 profile 而红。
          if [ "$CONFIG" = "Debug" ] && [ "$HAS_CERT" = "true" ] && [ "$HAS_ADHOC_PROFILE" = "true" ]; then
            SIGN_ARGS=(
              CODE_SIGN_STYLE=Manual
              CODE_SIGN_IDENTITY="Apple Distribution"
              DEVELOPMENT_TEAM="$TEAM_ID"
              PROVISIONING_PROFILE_SPECIFIER="$ADHOC_SPECIFIER"
              # Debug 默认会把 get-task-allow 注进 entitlements，而 Ad Hoc 描述文件里是 false，
              # 两者不一致会导致签名失败；关掉注入即可。
              CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
            )
          elif [ "$CONFIG" = "Release" ] && [ "$HAS_CERT" = "true" ] && [ "$HAS_APPSTORE_PROFILE" = "true" ]; then
            SIGN_ARGS=(
              CODE_SIGN_STYLE=Manual
              CODE_SIGN_IDENTITY="Apple Distribution"
              DEVELOPMENT_TEAM="$TEAM_ID"
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPECIFIER"
            )
          else
            SIGN_ARGS=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          fi

          xcodebuild archive \
            -project flip_chess.xcodeproj \
            -scheme flip_chess \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath "build/flip_chess.xcarchive" \
            "${SIGN_ARGS[@]}" \
            | xcbeautify --renderer github-actions 2>/dev/null || \
          xcodebuild archive \
            -project flip_chess.xcodeproj \
            -scheme flip_chess \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath "build/flip_chess.xcarchive" \
            "${SIGN_ARGS[@]}"

      - name: Assemble IPA
        run: |
          set -e
          APP="build/flip_chess.xcarchive/Products/Applications/flip_chess.app"
          test -d "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -q -r -y "flip_chess-${LABEL}.ipa" Payload/

      - name: Verify artifact
        run: |
          set -e
          IPA="flip_chess-${LABEL}.ipa"
          ls -la "$IPA"
          rm -rf /tmp/v && mkdir -p /tmp/v
          unzip -q "$IPA" -d /tmp/v
          A=/tmp/v/Payload/flip_chess.app
          echo "Bundle ID : $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$A/Info.plist")"
          echo "Display   : $(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$A/Info.plist")"
          echo "Version   : $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$A/Info.plist")"
          echo "Build     : $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$A/Info.plist")"
          file "$A/flip_chess"

          if [ -f "$A/embedded.mobileprovision" ]; then
            echo "--- signed ---"
            codesign -dv --verbose=2 "$A" 2>&1 | grep -E '^Authority|^TeamIdentifier' || true
            echo "--- profile ---"
            security cms -D -i "$A/embedded.mobileprovision" | plutil -extract Name raw -
            echo "--- entitlements ---"
            codesign -d --entitlements :- "$A" 2>/dev/null | plutil -p - | grep -E 'get-task-allow|application-identifier' || true
          else
            echo "--- unsigned build (no signing secrets configured) ---"
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: flip_chess-ipa-${{ matrix.label }}
          path: flip_chess-${{ matrix.label }}.ipa
          if-no-files-found: error
